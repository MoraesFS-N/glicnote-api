server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: glicnote-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/glicnote}
    username: ${DB_USERNAME:glicnote}
    password: ${DB_PASSWORD:}
    hikari:
      schema: glicnote
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  flyway:
    default-schema: glicnote
    schemas: glicnote
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
app:
  auth:
    issuer: ${SUPABASE_URL:http://localhost:54321}/auth/v1
    jwks-uri: ${SUPABASE_JWKS_URL:${SUPABASE_URL:http://localhost:54321}/auth/v1/.well-known/jwks.json}
    audience: authenticated
  cors-origins: ${CORS_ORIGINS:}
