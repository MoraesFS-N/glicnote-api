services:
  - type: web
    name: glicnote-api
    runtime: docker
    plan: free
    branch: master
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: '5'
      - key: CORS_ORIGINS
        value: ''
