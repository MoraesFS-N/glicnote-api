services:
  db:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: glicnote
      POSTGRES_USER: glicnote
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-glicnote-local-only}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - glicnote-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glicnote -d glicnote"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_URL: jdbc:postgresql://db:5432/glicnote
      DB_USERNAME: glicnote
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-glicnote-local-only}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
volumes:
  glicnote-data:
